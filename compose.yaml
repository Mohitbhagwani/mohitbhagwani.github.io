services:
  web:
    build:
      context: .
      target: development
    init: true
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 25
    command: sh -c "npm ci && npm run dev"
  e2e:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    profiles: [test]
    init: true
    working_dir: /app
    volumes:
      - .:/app
      - test_node_modules:/app/node_modules
    environment:
      BASE_URL: http://web:5173
    depends_on:
      web:
        condition: service_healthy
    command: sh -c "npm ci && npm run test:e2e"
volumes:
  node_modules:
  test_node_modules:
