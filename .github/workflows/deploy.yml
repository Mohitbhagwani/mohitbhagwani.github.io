name: Verify and deploy portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Docker development environment
        run: docker compose up --build --wait web
      - name: Lint
        run: docker compose exec -T web npm run lint
      - name: Type check
        run: docker compose exec -T web npm run typecheck
      - name: Test educational models
        run: docker compose exec -T web npm test
      - name: Production build
        run: docker compose exec -T web npm run build
      - name: Test production output
        run: |
          docker compose exec -d web npm run preview -- --port 4173
          docker compose --profile test run --rm -e BASE_URL=http://web:4173 e2e
      - name: Retain browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            playwright-report
            test-results
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Stop containers
        if: always()
        run: docker compose down
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
